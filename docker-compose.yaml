version: '3.8'

services:
  # --- Database: Postgres ---
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Cache: Redis ---
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --- Message Queue: RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_mq
    restart: always
    ports:
      - "5672:5672" # RabbitMQ Port หลัก
      - "15672:15672" # Management UI (สำหรับดูคิวผ่านเว็บ)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    # --- API Service ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_service
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      PORT: 4000
    depends_on:
      - postgres
      - redis
      - rabbitmq
    # --- Worker Service ---
  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: worker_service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      - postgres
      - rabbitmq

volumes:
  postgres_data:
  redis_data:
  rabbit_data:


networks:
  default:
    name: queue_network
